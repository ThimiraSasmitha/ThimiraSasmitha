
name: Update GitHub Streak Stats

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

concurrency:
  group: streak-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=dark&timezone=Asia/Colombo
          path: profile/streak.svg

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main

          git checkout origin/main -- . ':!profile/streak.svg'
          git checkout HEAD -- profile/streak.svg

          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0

          git push origin HEAD:main
