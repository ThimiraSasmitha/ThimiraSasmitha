
name: Update GitHub Streak Stats

on:
  schedule:
    - cron: "0 3 * * *"

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

  workflow_dispatch:

concurrency:
  group: streak-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=hacker&disable_animations=true&timezone=Asia/Colombo
          path: profile/streak.svg

      - name: Commit streak stats
        run: |
          mkdir -p /tmp/streak-output
          cp profile/streak.svg /tmp/streak-output/streak.svg

          git fetch origin main
          git worktree add /tmp/streak-repo origin/main

          cp /tmp/streak-output/streak.svg /tmp/streak-repo/profile/streak.svg

          cd /tmp/streak-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "Streak stats are already up to date."
            exit 0
          fi

          git commit -m "Update streak stats"
          git push origin HEAD:main
